# ============================================================
# AWS SECRETS MANAGER - CLUSTER SECRET STORE
# ============================================================
#
# ClusterSecretStore is a cluster-scoped External Secrets
# Operator resource.
#
# Unlike SecretStore, which is namespace-scoped,
# ClusterSecretStore can be referenced by ExternalSecrets
# from different namespaces.
#
# This store configures External Secrets Operator (ESO)
# to retrieve secrets from AWS Secrets Manager.
#
# ============================================================

apiVersion: external-secrets.io/v1

kind: ClusterSecretStore

metadata:
  # Name used by ExternalSecret.secretStoreRef.name
  name: aws-secretsmanager-store


spec:
  provider:

    # AWS provider configuration.
    aws:

      # AWS service from which secrets are retrieved.
      service: SecretsManager

      # AWS region containing the secret.
      region: ap-south-1

      auth:

        # Use Kubernetes ServiceAccount JWT authentication
        # with AWS IAM / IRSA-style federation.
        #
        # The ESO pod does not need a long-lived AWS access key
        # stored in a Kubernetes Secret.
        jwt:

          serviceAccountRef:

            # Kubernetes ServiceAccount used to obtain the
            # projected JWT token.
            name: external-secrets

            # Namespace containing the ServiceAccount.
            namespace: external-secrets


---
# ============================================================
# AWS SYSTEMS MANAGER PARAMETER STORE
# ============================================================
#
# This ClusterSecretStore is similar to the previous one,
# but it retrieves values from AWS Systems Manager
# Parameter Store instead of AWS Secrets Manager.
#
# Secrets Manager:
#   aws-secretsmanager-store
#
# Parameter Store:
#   aws-ssm-store
#
# ============================================================

apiVersion: external-secrets.io/v1

kind: ClusterSecretStore

metadata:
  name: aws-ssm-store


spec:
  provider:

    aws:
      # AWS service used by this store.
      service: ParameterStore

      # AWS region where the parameters exist.
      region: ap-south-1

      auth:

        # Authenticate using a Kubernetes ServiceAccount JWT.
        jwt:

          serviceAccountRef:
            # ServiceAccount used by ESO for AWS authentication.
            name: external-secrets

            # Namespace where the ServiceAccount exists.
            namespace: external-secrets


---
# ============================================================
# EXTERNAL SECRET - DATABASE ENDPOINT
# ============================================================
#
# ExternalSecret is namespace-scoped.
#
# Its purpose is to tell External Secrets Operator:
#
#   "Read this value from an external secret manager
#    and create/update this Kubernetes Secret."
#
# Flow:
#
# AWS SSM Parameter Store
#          │
#          │ read parameter
#          ▼
# External Secrets Operator
#          │
#          │ creates/updates
#          ▼
# Kubernetes Secret
#          │
#          ▼
# gowebapp application
#
# ============================================================

apiVersion: external-secrets.io/v1

kind: ExternalSecret

metadata:

  # Name of the ExternalSecret resource.
  name: db-endpoint

  # ExternalSecret is namespace-scoped.
  namespace: gowebapp

  annotations:

    # Argo CD sync wave controls synchronization order.
    #
    # Lower numbers are applied before higher numbers.
    #
    # -1 means this ExternalSecret should be synchronized
    # before resources using the generated Secret.
    #
    # Example:
    #
    # ExternalSecret       wave -1
    # Deployment           wave  0
    #
    # This helps ensure the external secret is created before
    # the application workload is deployed.
    "argocd.argoproj.io/sync-wave": "-1"


spec:

  # ESO periodically refreshes the value from AWS.
  #
  # 1h = every one hour.
  #
  # If the AWS parameter changes, ESO can update the
  # Kubernetes Secret during a refresh.
  refreshInterval: 1h


  # Defines which SecretStore should be used.
  secretStoreRef:

    # Reference to our AWS Parameter Store configuration.
    name: aws-ssm-store

    # ClusterSecretStore is cluster-scoped.
    kind: ClusterSecretStore


  # Defines the Kubernetes Secret that ESO creates.
  target:

    # Name of the Kubernetes Secret.
    #
    # The resulting Secret will be:
    #
    # Secret/db-endpoint
    #
    # in namespace gowebapp.
    name: db-endpoint

    # Owner means the generated Secret is owned by the
    # ExternalSecret resource.
    #
    # If the ExternalSecret is deleted, ESO can remove
    # the generated Secret according to this ownership policy.
    creationPolicy: Owner


  # Values to retrieve from AWS.
  data:

    # --------------------------------------------------------
    # DATABASE HOST
    # --------------------------------------------------------

    - secretKey: host

      # AWS SSM Parameter Store reference.
      remoteRef:

        # Parameter Store parameter name.
        #
        # Leading "/" is part of the parameter path.
        key: /gowebapp/prod/database/host


    # --------------------------------------------------------
    # DATABASE PORT
    # --------------------------------------------------------

    - secretKey: port

      remoteRef:
        key: /gowebapp/prod/database/port


---
# ============================================================
# EXTERNAL SECRET - DATABASE ROOT CREDENTIALS
# ============================================================
#
# This ExternalSecret retrieves username/password values
# from AWS Secrets Manager.
#
# Flow:
#
# AWS Secrets Manager
#          │
#          │ secret
#          ▼
# External Secrets Operator
#          │
#          ▼
# Kubernetes Secret
#          │
#          ├── username
#          └── password
#
# ============================================================

apiVersion: external-secrets.io/v1

kind: ExternalSecret

metadata:

  # Name of the ExternalSecret resource.
  name: db-root-credentials

  # Namespace where the ExternalSecret and generated Secret
  # will exist.
  namespace: gowebapp

  annotations:

    # Synchronize this ExternalSecret before normal resources.
    #
    # Useful when the generated Secret is required by a
    # Deployment.
    "argocd.argoproj.io/sync-wave": "-1"


spec:

  # ESO checks AWS for changes every hour.
  refreshInterval: 1h


  # Use the AWS Secrets Manager ClusterSecretStore.
  secretStoreRef:

    # Store created earlier in this manifest.
    name: aws-secretsmanager-store

    # It is a ClusterSecretStore rather than a namespace-scoped
    # SecretStore.
    kind: ClusterSecretStore


  # Configuration for the Kubernetes Secret generated by ESO.
  target:

    # Name of the Kubernetes Secret.
    #
    # The resulting resource will be:
    #
    # Secret/db-root-credentials
    #
    # in namespace gowebapp.
    name: db-root-credentials

    # ESO owns the generated Kubernetes Secret.
    creationPolicy: Owner


  # ==========================================================
  # SECRET DATA
  # ==========================================================
  #
  # Maps values from AWS Secrets Manager to keys in the
  # generated Kubernetes Secret.

  data:

    # --------------------------------------------------------
    # USERNAME
    # --------------------------------------------------------

    - secretKey: username

      remoteRef:

        # Name/identifier of the AWS Secrets Manager secret.
        key: rds!db-8405529e-f9c9-4cd8-b976-41e38acbd206

        # The AWS secret contains structured data, for example:
        #
        # {
        #   "username": "...",
        #   "password": "..."
        # }
        #
        # property tells ESO to extract only the username
        # field from that JSON secret.
        property: username


    # --------------------------------------------------------
    # PASSWORD
    # --------------------------------------------------------

    - secretKey: password

      remoteRef:

        # Same AWS Secrets Manager secret.
        key: rds!db-8405529e-f9c9-4cd8-b976-41e38acbd206

        # Extract only the password property.
        property: password
